[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retroz-s1"
version = "0.1.0"
description = "Constrained ink-edge reconstruction research and negative-results analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Saif Shafique" },
]
keywords = [
  "computer-vision",
  "image-processing",
  "reproducible-research",
  "negative-results",
  "provenance",
]
dependencies = [
  "numpy>=2,<3",
  "Pillow>=12.3.0,<13",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "PyYAML>=6,<7",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "PyYAML>=6,<7",
  "ruff>=0.12,<1",
]
docs = [
  "mkdocs>=1.6,<2",
  "matplotlib>=3.9,<4",
]
reproduce = [
  "numpy==2.3.5",
  "Pillow==12.3.0",
  "matplotlib==3.10.8",
  "PyYAML==6.0.3",
  "mkdocs==1.6.1",
]

[project.urls]
Homepage = "https://github.com/TomoeKoga556/retroz-s1-ink-profile-reconstruction"
Repository = "https://github.com/TomoeKoga556/retroz-s1-ink-profile-reconstruction"
Issues = "https://github.com/TomoeKoga556/retroz-s1-ink-profile-reconstruction/issues"
Documentation = "https://github.com/TomoeKoga556/retroz-s1-ink-profile-reconstruction/tree/main/docs"

[project.scripts]
retroz-s1 = "retroz_s1.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retroz_s1 = ["configs/*.json", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "release", "site-preview"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
