[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retroz-s1"
version = "0.1.0"
description = "Controlled ink-profile reconstruction research and negative-results analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]
docs = ["mkdocs>=1.6,<2", "matplotlib>=3.9,<4"]

[project.scripts]
retroz-s1 = "retroz_s1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retroz_s1 = ["configs/*.json", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
