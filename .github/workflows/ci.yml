name: public-safe-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 Pillow==11.2.1 pytest==9.0.2 PyYAML==6.0.2 matplotlib==3.10.3
      - run: PYTHONPATH=src python -m pytest -q
      - run: PYTHONPATH=src python scripts/generate_synthetic_demo.py
      - run: PYTHONPATH=src python scripts/build_report.py
      - run: PYTHONPATH=src python scripts/build_docs.py
      - run: PYTHONPATH=src python scripts/validate_documents.py
      - run: PYTHONPATH=src python scripts/build_manifests.py
      - run: PYTHONPATH=src python scripts/verify_repository.py
