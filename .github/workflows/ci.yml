name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Static checks
        run: python -m ruff check .

      - name: Test installed package
        run: python -m pytest

      - name: Smoke-test console entry point
        run: |
          retroz-s1 --version
          retroz-s1 list-candidates

      - name: Build wheel and source distribution
        run: python -m build

  generated-artifacts:
    name: generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package, tests and documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reproduce]"

      - name: Regenerate public artifacts
        run: |
          python scripts/generate_synthetic_demo.py
          python scripts/build_report.py
          python scripts/build_docs.py
          python scripts/update_registry_provenance.py
          python scripts/validate_documents.py
          python scripts/build_manifests.py
          python scripts/verify_repository.py

      - name: Check committed generated files
        run: git diff --exit-code
